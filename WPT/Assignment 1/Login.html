<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to right, #cfd9df, #e2ebf0);
    }

    .container {
        width: 800px;
        height: 400px;
        display: flex;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

   
    .left {
        width: 50%;
        background: #f5f5f5;
        padding: 40px;
        text-align: center;
    }

    .left h2 {
        margin-bottom: 20px;
        color: #333;
    }

    .social-icons {
        margin: 10px 0;
    }

    .social-icons span {
        display: inline-block;
        width: 35px;
        height: 35px;
        line-height: 35px;
        border-radius: 50%;
        background: #ddd;
        margin: 0 5px;
        cursor: pointer;
    }

    .left p {
        font-size: 12px;
        margin: 10px 0;
        color: gray;
    }

    .input-box {
        width: 100%;
        margin: 10px 0;
    }

    .input-box input {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 20px;
        background: #e0e0e0;
        outline: none;
    }

    .forgot {
        font-size: 12px;
        margin: 10px 0;
        color: gray;
        cursor: pointer;
    }

    .btn {
        margin-top: 10px;
        padding: 10px 25px;
        border: none;
        border-radius: 20px;
        background: #007bff;
        color: white;
        cursor: pointer;
    }

  
    .right {
        width: 50%;
        background: linear-gradient(to right, #1fa2ff, #12d8fa);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px;
    }

    .right h2 {
        font-size: 26px;
        margin-bottom: 10px;
    }

    .right p {
        font-size: 14px;
        margin-bottom: 20px;
    }

    .signup-btn {
        padding: 10px 25px;
        border-radius: 20px;
        border: 1px solid white;
        background: transparent;
        color: white;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="container">
    
    <!-- LEFT SIDE -->
    <div class="left">
        <h2>Sign in</h2>

        <div class="social-icons">
            <span><i class="fa-brands fa-github"></i></span>
            <span><i class="fa-brands fa-google"></i></span>
            <span><i class="fa-brands fa-linkedin"></i></span>
        </div>

        <p>Or sign in using E-Mail Address</p>

        <div class="input-box">
            <input type="email" placeholder="Email">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password">
        </div>

        <div class="forgot">Forgot your password?</div>

        <button class="btn">SIGN IN</button>
    </div>

    
    <div class="right">
        <div>
            <h2>Create, Account!</h2>
            <p>Sign up if you still don't have an account ...</p>
            <button class="signup-btn">SIGN UP</button>
        </div>
    </div>

</div>

</body>
</html>
