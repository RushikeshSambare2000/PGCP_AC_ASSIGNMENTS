<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #dfe3e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 700px;
            height: 350px;
            background: #fff;
            display: flex;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
        }

       
        .left {
            width: 50%;
            background: linear-gradient(133deg, #2ecc71 50%, transparent 50%);
            color: white;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: right;
        }

        .left h1 {
            margin-bottom: 10px;
        }

        .left p {
            margin-bottom: 20px;
        }

       .left button {
            padding: 10px 10px;
            width: 100px;
            border: 1px solid white;
            background: transparent;
            color: white;
            border-radius: 20px;
            cursor: pointer;
        } 

        /* Right Section */
        .right {
            width: 50%;
            padding: 40px;
        }

        .right h2 {
            margin-bottom: 20px;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box input {
            width: 100%;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            outline: none;
        }

        .input-box input:focus {
            border-color: #2ecc71;
        }

        .right.input-box:invalid {
            border-color: red ;
        }

        .login-btn {
            width: 50%;
            padding: 10px;
            border: 2px solid #2ecc71;
            border-radius: 20px;
            background: transparent;
            color: #2ecc71;
            cursor: pointer;
            margin-top: 10px;
            margin-left: 25%;
            
        }

        .login-btn:hover {
            background: #2ecc71;
            color: white;
        }

        .forgot {
            display: block;
            margin-top: 10px;
            text-align: center;
            font-size: 12px;
            text-decoration: none;
            color: #2ecc71;
        }
    </style>
</head>
<body>

<div class="container">
    
  
    <div class="left">
        <h1>Welcome!</h1>
        <p>Create your account.<br>For Free!</p>
        <button>Sign Up</button>
    </div>

    <div class="right">
        <h2>Login</h2>

        <div class="input-box">
            <input type="text" placeholder="Username/Email address">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password">
        </div>

        <button class="login-btn">Sign In</button>
        <a href="#" class="forgot">Forgot password?</a>
    </div>

</div>
<script>
    let val1=10;
    let val2=5;
    function addnum(val1, val2){
        let total = val1+val2;
        return total;
    }
    let result1=addnum(val1, val2);
    let result2=addnum(10,2);
    console.log(result1,result2)
</script>

</body>
</html>
