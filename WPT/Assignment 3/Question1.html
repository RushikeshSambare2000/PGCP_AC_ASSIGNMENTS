<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraph Style Change</title>
    <style>
    </style>
</head>
<body>

    <div>
        <h2>Assignment no 3 : click on button to change paragraph font color and font-family</h2>

        <p id="para">
            It is rightly said that being disciplined is essential in life. 
            When a person leads a disciplined life, they set an easy path to success. 
            They will develop an approach to happiness and a beautiful future ahead.
        </p>

        <button onclick="changeStyle()">Submit</button>
    </div>

    <script>
        function changeStyle() {
            let paragraph = document.getElementById("para");

            paragraph.style.fontFamily= "monospace";
            paragraph.style.fontSize = "24px";
            paragraph.style.color = "darkred";
            paragraph.style.fontWeight = "bold";
        }
    </script>

</body>
</html>
