                                <h5 class="card-title">iPhone 15</h5>
                                <p>Price: ₹75,000</p>
                                <p>Rating: ⭐ 4.9</p>
                                <button class="btn btn-primary" onclick="addToCart('iPhone 15',75000)">
                                    Add to Cart
                                </button>
                            </div>

                    </div>

                </div>
            </div>

            <!-- Cart Section -->
            <div class="col-md-4">
                <div id="cartBox">
                    <h3>🛒 Cart</h3>
                    <ul id="cartItems"></ul>

                    <hr>

                    <p>Subtotal: ₹<span id="subtotal">0</span></p>
                    <p>Tax (10%): ₹<span id="tax">0</span></p>
                    <h5>Total: ₹<span id="total">0</span></h5>
                </div>
            </div>

        </div>
    </div>

    <script>
        // use let for changing total
        let totalPrice = 0;

        // use const for fixed tax rate
        const taxRate = 0.10;

        function addToCart(name, price) {
            let cartItems = document.getElementById("cartItems");

            // create new list item
            let li = document.createElement("li");
            li.textContent = `${name} - ₹${price}`;
            cartItems.appendChild(li);

            // update total
            totalPrice += price;

            // calculate tax
            let tax = totalPrice * taxRate;

            // final total
            let finalTotal = totalPrice + tax;

            // display values
            document.getElementById("subtotal").textContent = totalPrice;
            document.getElementById("tax").textContent = tax;
            document.getElementById("total").textContent = finalTotal;
        }
    </script>
